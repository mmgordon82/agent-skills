# Pinned upstreams. `paths` maps a dist path to a path in the upstream repo; entries copy in order.
# Patches in patches/<name>/*.patch apply on top. Bump a pin with: uv run build.py bump <name>

[pstack]
license_file = "LICENSE"
repo = "backnotprop/pstack"
rev = "0d2dc00df47d7686c94324cfe9c3444710d9f16d"
license = "MIT"
paths = { architect = "skills/architect", arena = "skills/arena", no-comments = "skills/no-comments", poteto-mode = "skills/poteto-mode", reflect = "skills/reflect", setup-pstack = "skills/setup-pstack", swarm = "skills/swarm", technical-writing = "skills/technical-writing", unslop = "skills/unslop" }

[taste-skill]
license_file = "LICENSE"
repo = "Leonxlnx/taste-skill"
rev = "f6b76575f949707b4e3c37cd86cb44b0b98643e8"
license = "MIT"
paths = { design-taste-frontend = "skills/taste-skill" }

[pfd]
repo = "skovalik/perception-first-design"
rev = "1704ff61c18872a66d969e860c9b6e45a8f50f16"
license = "CC-BY-SA-4.0"
# Flattened: the repo's skill dir plus the corpus/framework/commands/scripts it references.
paths = { pfd = "skills/pfd", "pfd/corpus" = "corpus", "pfd/framework" = "framework", "pfd/commands" = "commands", "pfd/scripts" = "scripts", "pfd/LICENSE" = "LICENSE", "pfd/NOTICE" = "NOTICE" }

[mattpocock]
license_file = "LICENSE"
repo = "mattpocock/skills"
rev = "5863806dd4e15c63174bee4e7515a4256792ecfa"
license = "MIT"
paths = { writing-for-agents = "skills/productivity/writing-for-agents", git-guardrails-claude-code = "skills/misc/git-guardrails-claude-code" }
