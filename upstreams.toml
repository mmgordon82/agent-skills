# Pinned upstreams. `paths` maps a dist path to a path in the upstream repo; entries copy in order.
# Patches in patches/<name>/*.patch apply on top. Bump a pin with: uv run build.py bump <name>
# `tiered = true` retargets that upstream's patches when only a model id changes, and rejects
# vendor model ids in its built skills. The registry name does not select the policy.

[pstack]
license_file = "LICENSE"
repo = "backnotprop/pstack"
rev = "c3464c11c60b1352d5e8f5f0428a3a6943837568"
license = "MIT"
tiered = true
paths = { architect = "skills/architect", arena = "skills/arena", no-comments = "skills/no-comments", poteto-mode = "skills/poteto-mode", reflect = "skills/reflect", setup-pstack = "skills/setup-pstack", swarm = "skills/swarm", technical-writing = "skills/technical-writing", unslop = "skills/unslop", benchmark-checklist = "skills/benchmark-checklist", create-formal-verification-skill = "skills/create-formal-verification-skill", create-verification-skill = "skills/create-verification-skill", figure-it-out = "skills/figure-it-out", how = "skills/how", interrogate = "skills/interrogate", ketchup = "skills/ketchup", show-me-your-work = "skills/show-me-your-work", tdd = "skills/tdd", why = "skills/why", principle-attack-the-premise = "skills/principle-attack-the-premise", principle-boundary-discipline = "skills/principle-boundary-discipline", principle-build-the-lever = "skills/principle-build-the-lever", principle-encode-lessons-in-structure = "skills/principle-encode-lessons-in-structure", principle-exhaust-the-design-space = "skills/principle-exhaust-the-design-space", principle-experience-first = "skills/principle-experience-first", principle-explain-the-number = "skills/principle-explain-the-number", principle-fix-root-causes = "skills/principle-fix-root-causes", principle-foundational-thinking = "skills/principle-foundational-thinking", principle-guard-the-context-window = "skills/principle-guard-the-context-window", principle-laziness-protocol = "skills/principle-laziness-protocol", principle-make-operations-idempotent = "skills/principle-make-operations-idempotent", principle-migrate-callers-then-delete-legacy-apis = "skills/principle-migrate-callers-then-delete-legacy-apis", principle-minimize-reader-load = "skills/principle-minimize-reader-load", principle-model-the-domain = "skills/principle-model-the-domain", principle-never-block-on-the-human = "skills/principle-never-block-on-the-human", principle-outcome-oriented-execution = "skills/principle-outcome-oriented-execution", principle-prove-it-works = "skills/principle-prove-it-works", principle-redesign-from-first-principles = "skills/principle-redesign-from-first-principles", principle-separate-before-serializing-shared-state = "skills/principle-separate-before-serializing-shared-state", principle-sequence-verifiable-units = "skills/principle-sequence-verifiable-units", principle-subtract-before-you-add = "skills/principle-subtract-before-you-add", principle-test-behavior-not-implementation = "skills/principle-test-behavior-not-implementation", principle-type-system-discipline = "skills/principle-type-system-discipline" }

