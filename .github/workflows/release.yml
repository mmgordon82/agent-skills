# Weekly: move every upstream pin to its HEAD (a pin whose patches no longer apply stays put),
# rebuild, and if the built skills differ from the last release: commit them to the `release`
# branch, tag it with the date, and publish a GitHub release with a changelog and archives.
name: release

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: "**/*.py"  # scripts declare their deps inline (PEP 723); no lockfile

      - name: Bump upstream pins
        id: bump
        continue-on-error: true
        run: uv run build.py bump

      - name: Build
        run: uv run build.py build

      - name: Release if changed
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run ci/release.py

      - name: Fail if an upstream was held back
        if: steps.bump.outcome == 'failure'
        run: |
          echo "::error::An upstream moved and its patches no longer apply. See the 'Bump upstream pins' step."
          exit 1
