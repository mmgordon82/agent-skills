name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: "**/*.py"  # scripts declare their deps inline (PEP 723); no lockfile

      - name: Test pipeline behavior
        run: uv run tests/run.py

      - name: Build and verify dist
        run: |
          uv run build.py build
          uv run build.py verify --against dist

      - name: Intent checks
        run: uv run ci/intent_checks.py

      - name: Check generated graphics
        run: |
          uv run docs/graphics.py
          git diff --exit-code -- docs/assets README.md
