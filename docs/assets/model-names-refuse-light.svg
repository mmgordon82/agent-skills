<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="t">
<title id="t">The build leaves the patch unchanged when other words changed, when the sentence matches more than once, when the old model name still appears outside the match, or when the patch is not a normal text diff.</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
</style>
<rect width="920" height="420" rx="16" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="919" height="419" rx="16" fill="none" stroke="#d1d9e0"/>
<rect x="24" y="24" width="428" height="176" rx="10" fill="#ffebe9" stroke="#cf222e"/>
<text x="40" y="52" class="sans" font-size="14" font-weight="600" fill="#cf222e">Other words changed</text>
<text x="40" y="86" class="mono" font-size="14" fill="#1f2328">Budget: high.</text>
<text x="40" y="110" class="mono" font-size="14" fill="#1f2328">Budget: low.</text>
<text x="40" y="148" class="sans" font-size="14" fill="#1f2328">high and low are not model names.</text>
<text x="40" y="170" class="sans" font-size="14" fill="#1f2328">The sentence no longer matches, so the build stops.</text>
<rect x="468" y="24" width="428" height="176" rx="10" fill="#ffebe9" stroke="#cf222e"/>
<text x="484" y="52" class="sans" font-size="14" font-weight="600" fill="#cf222e">More than one match</text>
<text x="484" y="86" class="sans" font-size="14" fill="#1f2328">The same sentence appears twice.</text>
<text x="484" y="148" class="sans" font-size="14" fill="#1f2328">The build will not pick one.</text>
<text x="484" y="170" class="sans" font-size="14" fill="#1f2328">Zero matches stops the same way.</text>
<rect x="24" y="220" width="428" height="176" rx="10" fill="#ffebe9" stroke="#cf222e"/>
<text x="40" y="248" class="sans" font-size="14" font-weight="600" fill="#cf222e">Old name still elsewhere</text>
<text x="40" y="282" class="sans" font-size="14" fill="#1f2328">This paragraph lost the old id.</text>
<text x="40" y="306" class="sans" font-size="14" fill="#1f2328">Another paragraph still has it.</text>
<text x="40" y="344" class="sans" font-size="14" fill="#1f2328">The match may be the wrong copy.</text>
<text x="40" y="366" class="sans" font-size="14" fill="#1f2328">The build stops.</text>
<rect x="468" y="220" width="428" height="176" rx="10" fill="#ffebe9" stroke="#cf222e"/>
<text x="484" y="248" class="sans" font-size="14" font-weight="600" fill="#cf222e">Not a normal text diff</text>
<text x="484" y="282" class="mono" font-size="14" fill="#1f2328">\ No newline at end of file</text>
<text x="484" y="344" class="sans" font-size="14" fill="#1f2328">Also a path that is absolute or contains ..</text>
<text x="484" y="366" class="sans" font-size="14" fill="#1f2328">This step is skipped. The apply fails as usual.</text>
</svg>
