<svg xmlns="http://www.w3.org/2000/svg" width="920" height="612" viewBox="0 0 920 612" role="img" aria-labelledby="t">
<title id="t">Build pipeline: pin upstreams, apply patches, build dist, install with npx skills into any agent</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .flow { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e6eaef"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
</defs>
<rect width="920" height="612" rx="16" fill="#ffffff"/>
<rect width="920" height="612" rx="16" fill="url(#dots)"/>
<rect x="0.5" y="0.5" width="919" height="611" rx="16" fill="none" stroke="#d1d9e0"/>
<text x="40" y="52" class="mono" font-size="14" font-weight="600" fill="#59636e" text-anchor="start" letter-spacing="1.5">1  PIN</text>
<rect x="40" y="72" width="400" height="38" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<rect x="40" y="81" width="3" height="20" rx="1.5" fill="#9a6700"/>
<text x="58" y="97" class="mono" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >backnotprop/</text>
<text x="162.8" y="97" class="sans" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start" >pstack</text>
<rect x="40" y="118" width="400" height="38" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<rect x="40" y="127" width="3" height="20" rx="1.5" fill="#9a6700"/>
<text x="58" y="143" class="mono" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >Leonxlnx/</text>
<text x="137.6" y="143" class="sans" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start" >taste-skill</text>
<rect x="40" y="164" width="400" height="38" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<rect x="40" y="173" width="3" height="20" rx="1.5" fill="#9a6700"/>
<text x="58" y="189" class="mono" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >skovalik/</text>
<text x="137.6" y="189" class="sans" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start" >perception-first-design</text>
<rect x="40" y="210" width="400" height="38" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<rect x="40" y="219" width="3" height="20" rx="1.5" fill="#9a6700"/>
<text x="58" y="235" class="mono" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >mattpocock/</text>
<text x="154.39999999999998" y="235" class="sans" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start" >skills</text>
<rect x="40" y="262" width="400" height="38" rx="10" fill="#f6f8fa" stroke="#8250df"/>
<text x="58" y="287" class="mono" font-size="15" font-weight="600" fill="#8250df" text-anchor="start" >skills/</text>
<text x="133.0" y="287" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >13 own + forked skills</text>
<text x="480" y="52" class="mono" font-size="14" font-weight="600" fill="#59636e" text-anchor="start" letter-spacing="1.5">2  PATCH</text>
<rect x="480" y="72" width="400" height="176" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="498" y="102" class="mono" font-size="15" font-weight="600" fill="#9a6700" text-anchor="start" >patches/&lt;upstream&gt;/&lt;skill&gt;.patch</text>
<text x="498" y="128" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >each opens with a Why: line</text>
<text x="498" y="158" class="mono" font-size="14" font-weight="400" fill="#9a6700" text-anchor="start" >Why: model tiers, not vendor ids</text>
<text x="498" y="182" class="mono" font-size="14" font-weight="400" fill="#9a6700" text-anchor="start" >Why: typed-only /pfd</text>
<text x="498" y="206" class="mono" font-size="14" font-weight="400" fill="#9a6700" text-anchor="start" >Why: trigger words first</text>
<rect x="480" y="258" width="400" height="42" rx="10" fill="#f6f8fa" stroke="#1a7f37"/>
<text x="498" y="285" class="mono" font-size="15" font-weight="600" fill="#1a7f37" text-anchor="start" >git apply</text>
<text x="591.0" y="285" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >fails loudly if upstream moved</text>
<text x="480" y="344" class="mono" font-size="14" font-weight="600" fill="#59636e" text-anchor="start" letter-spacing="1.5">3  BUILD</text>
<rect x="480" y="364" width="400" height="216" rx="10" fill="#f6f8fa" stroke="#1f2328"/>
<text x="498" y="394" class="mono" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" >uv run build.py</text>
<text x="498" y="428" class="mono" font-size="15" font-weight="600" fill="#0969da" text-anchor="start" >build</text>
<text x="590" y="428" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >pins + patches → dist/</text>
<text x="498" y="460" class="mono" font-size="15" font-weight="600" fill="#0969da" text-anchor="start" >verify</text>
<text x="590" y="460" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >diff vs installed</text>
<text x="498" y="492" class="mono" font-size="15" font-weight="600" fill="#0969da" text-anchor="start" >diff</text>
<text x="590" y="492" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >your edit → .patch</text>
<text x="498" y="524" class="mono" font-size="15" font-weight="600" fill="#0969da" text-anchor="start" >bump</text>
<text x="590" y="524" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >move pins, hold back broken</text>
<text x="498" y="556" class="mono" font-size="15" font-weight="600" fill="#0969da" text-anchor="start" >install</text>
<text x="590" y="556" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >symlink dist/</text>
<text x="40" y="344" class="mono" font-size="14" font-weight="600" fill="#59636e" text-anchor="start" letter-spacing="1.5">4  INSTALL</text>
<rect x="40" y="364" width="400" height="42" rx="10" fill="#f6f8fa" stroke="#1a7f37"/>
<text x="58" y="391" class="mono" font-size="15" font-weight="600" fill="#1a7f37" text-anchor="start" >dist/</text>
<text x="115.0" y="391" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >60 skills, or a weekly release</text>
<rect x="40" y="422" width="400" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="58" y="446" class="mono" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >npx skills add …#release</text>
<text x="58" y="466" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >any agent</text>
<rect x="40" y="488" width="400" height="56" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="58" y="512" class="mono" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >build.py install</text>
<text x="58" y="532" class="sans" font-size="14" font-weight="400" fill="#59636e" text-anchor="start" >maintainer: live links to dist/</text>
<path class="flow" d="M442,132 C459.0,132 459.0,132 476,132" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow)"/>
<path class="flow" d="M442,281 C459.0,281 459.0,394 476,394" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow)"/>
<path class="flow" d="M820,302 L820,360" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow)"/>
<path class="flow" d="M478,450 C461.0,450 461.0,450 444,450" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
